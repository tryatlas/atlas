name: Release

# How a release happens (CONTRIBUTING.md → "Releasing" has the picture):
#
# 1. Every push to `main` runs release-please. It keeps one open pull request,
#    "chore: release X.Y.Z". The version comes from the Conventional Commits
#    on `main` since the last release: each merge commit (titled with its PR
#    title) and the branch commits it brings in (pre-1.0: any `feat` → minor,
#    only `fix`/`perf` → patch), and CHANGELOG.md in the same PR lists them.
# 2. release-please moves package.json only. `sync-version` runs
#    scripts/bump.sh on the PR branch for the other three version files, then
#    starts CI on it: a push made with GITHUB_TOKEN starts no workflow, and the
#    PR needs "CI passed" to merge.
# 3. Merging that PR tags `alpha-X.Y.Z` and publishes the GitHub release. The
#    build jobs below attach the installers. They are called from here rather
#    than triggered by the tag because a tag created with GITHUB_TOKEN starts
#    no workflow either.
#
# 4. After the installers are attached and someone approves the `release`
#    environment, `announce` sets the PostHog remote-config keys that tell
#    installed apps an update exists (CONTRIBUTING.md lists them).

on:
  push:
    branches: [main]
  workflow_dispatch:

# Not `${{ github.workflow }}-${{ github.ref }}`: the reusable Linux workflow
# below evaluates its own concurrency group with this workflow's name and ref,
# and the two must not collide.
concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-please:
    name: Release PR
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
      version: ${{ steps.rp.outputs.version }}
      pr: ${{ steps.rp.outputs.pr }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  sync-version:
    name: Sync version files on the release PR
    needs: release-please
    if: needs.release-please.outputs.pr != ''
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
      actions: write
    env:
      BRANCH: ${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.BRANCH }}
      - name: Run scripts/bump.sh at the release PR's version
        run: |
          version="$(jq -r '."."' .release-please-manifest.json)"
          bash scripts/bump.sh "$version"
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "chore: sync version files to $version"
            git push origin "HEAD:$BRANCH"
          fi
      - name: Run CI on the release PR
        run: gh workflow run ci.yml --ref "$BRANCH"

  linux:
    name: Linux packages
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/release-linux.yml
    with:
      tag: ${{ needs.release-please.outputs.tag }}
      version: ${{ needs.release-please.outputs.version }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    secrets: inherit

  # Signed and notarized DMGs for Apple Silicon and Intel, built by
  # scripts/release-macos.sh exactly as on a laptop, with the Developer ID
  # certificate imported into a throwaway keychain. Off until the signing
  # secrets exist: set the repository variable MACOS_RELEASE=true once
  # APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_ID, APPLE_PASSWORD and
  # POSTHOG_KEY are in the `release` environment. The environment's
  # required reviewer approves each run.
  macos:
    name: macOS DMGs
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true' && vars.MACOS_RELEASE == 'true'
    runs-on: macos-latest
    environment: release
    permissions:
      contents: write
    env:
      TAG: ${{ needs.release-please.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - uses: jdx/mise-action@v2
      - name: Install the pinned Rust toolchain and the Intel target
        run: |
          rustup toolchain install
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Install
        run: bun install --frozen-lockfile
      - name: Import the Developer ID certificate into a throwaway keychain
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/release.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" \
            $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
      - name: Build, sign and notarize both DMGs
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}
          POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}
        run: ./scripts/release-macos.sh
      - name: Attach the DMGs to the release
        run: gh release upload "$TAG" target/*-apple-darwin/release/bundle/dmg/Atlas_*.dmg --clobber
      - name: Delete the keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/release.keychain-db" || true

  # The x64 MSI, built exactly as `bun run build:app:win` makes it locally,
  # then signed by SignPath Foundation. Off until the repository variable
  # WINDOWS_RELEASE=true: without POSTHOG_KEY the build has no telemetry key,
  # and so no updater.
  #
  # Signing. The built MSI is uploaded as a workflow artifact and submitted
  # to SignPath; SignPath fetches it from GitHub itself, which is how it
  # verifies the file came from this repository's build. The artifact
  # configuration (`MSI_installer` in the SignPath project) signs Atlas.exe
  # inside the MSI, then the MSI. Needs the SIGNPATH_API_TOKEN secret on the
  # `release` environment (a SignPath CI user that is a submitter on the
  # policy) and the SIGNPATH_ORGANIZATION_ID variable; without the variable
  # the MSI ships unsigned. SIGNPATH_SIGNING_POLICY_SLUG picks the policy:
  # `test-signing` (self-signed, SmartScreen still warns) until the release
  # certificate is issued, then `release-signing`, where each request waits
  # for a SignPath approver, hence the long timeout.
  windows:
    name: Windows MSI
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true' && vars.WINDOWS_RELEASE == 'true'
    runs-on: windows-latest
    environment: release
    permissions:
      contents: write
      # SignPath downloads the unsigned artifact with this job's token.
      actions: read
    env:
      TAG: ${{ needs.release-please.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
      SIGN: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - uses: jdx/mise-action@v2
      - name: Install the pinned Rust toolchain and the x64 target
        run: |
          rustup toolchain install
          rustup target add x86_64-pc-windows-msvc
      - name: Install
        run: bun install --frozen-lockfile
      - name: Build the MSI
        env:
          POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}
          POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}
        run: bun run build:app:win
      - name: Upload the unsigned MSI for SignPath
        id: unsigned
        if: env.SIGN == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: windows-msi-unsigned
          path: target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
          if-no-files-found: error
      - name: Sign the MSI (SignPath)
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'atlas' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'test-signing' }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG || 'MSI_installer' }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed-msi
      - name: Attach the MSI to the release
        shell: bash
        run: |
          set -euo pipefail
          if [ "$SIGN" = true ]; then
            msi=(signed-msi/*.msi)
          else
            echo "::warning title=Windows release unsigned::SIGNPATH_ORGANIZATION_ID is not set"
            msi=(target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi)
          fi
          gh release upload "$TAG" "${msi[@]}" --clobber

  # Tells installed apps the release exists: sets the PostHog feature-flag
  # payloads the updater reads (`telemetry::fetch_remote_config`): `version`,
  # and one installer URL per platform (`telemetry::update_uri_flag`). A
  # shared version moves only after every platform's installer succeeded.
  # Older clients pair that version with their URL, so partial publication
  # would advertise a new version with an old macOS or Windows installer.
  #
  # Waits on the `release` environment's approval, so someone can install the
  # new build from the GitHub release before any user is offered it. Off until
  # the POSTHOG_PERSONAL_API_KEY secret (scope: feature_flag:write) and the
  # POSTHOG_PROJECT_ID variable exist. POSTHOG_API_HOST is the app host
  # (https://us.posthog.com or https://eu.posthog.com), not the ingest host.
  announce:
    name: Announce the update (PostHog)
    needs: [release-please, linux, macos, windows]
    if: >-
      always() && needs.release-please.outputs.release_created == 'true' &&
      needs.linux.result == 'success' && needs.macos.result == 'success' &&
      needs.windows.result == 'success' && vars.POSTHOG_PROJECT_ID != ''
    runs-on: ubuntu-24.04-arm
    environment: release
    permissions:
      contents: read
    env:
      TAG: ${{ needs.release-please.outputs.tag }}
      VERSION: ${{ needs.release-please.outputs.version }}
      MACOS_OK: ${{ needs.macos.result == 'success' }}
      WINDOWS_OK: ${{ needs.windows.result == 'success' }}
      PH_KEY: ${{ secrets.POSTHOG_PERSONAL_API_KEY }}
      PH_PROJECT: ${{ vars.POSTHOG_PROJECT_ID }}
      PH_HOST: ${{ vars.POSTHOG_API_HOST || 'https://us.posthog.com' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Set the update flags
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PH_KEY" || { echo "::error::POSTHOG_PERSONAL_API_KEY is not set"; exit 1; }
          repo="$GITHUB_REPOSITORY"
          page="https://github.com/$repo/releases/tag/$TAG"
          assets="$(gh release view "$TAG" --repo "$repo" --json assets --jq '.assets[].name')"
          asset_url() { # first asset matching a pattern, as a download URL
            local name; name="$(grep -E "$1" <<<"$assets" | head -1 || true)"
            [ -n "$name" ] || { echo "::error::no release asset matches $1" >&2; return 1; }
            echo "https://github.com/$repo/releases/download/$TAG/$name"
          }

          # The URLs first, the version last: an app that sees the new version
          # must already find a URL for it.
          declare -a keys=() values=()
          keys+=(uri_linux_x86_64 uri_linux_aarch64); values+=("$page" "$page")
          if [ "$MACOS_OK" = true ]; then
            keys+=(uri_mac_arm uri_mac_intel)
            values+=("$(asset_url '_aarch64\.dmg$')" "$(asset_url '_(x64|x86_64)\.dmg$')")
          fi
          if [ "$WINDOWS_OK" = true ]; then
            keys+=(uri_win_intel); values+=("$(asset_url '\.msi$')")
          fi
          keys+=(version); values+=("$VERSION")

          api="$PH_HOST/api/projects/$PH_PROJECT/feature_flags"
          auth=(-H "Authorization: Bearer $PH_KEY" -H "Content-Type: application/json")
          for i in "${!keys[@]}"; do
            key="${keys[$i]}"; value="${values[$i]}"
            flag="$(curl -fsS "${auth[@]}" "$api/?search=$key&limit=100" \
              | jq -c --arg k "$key" '[.results[] | select(.key == $k)][0] // empty')"
            [ -n "$flag" ] || { echo "::error::PostHog has no feature flag named $key"; exit 1; }
            id="$(jq -r .id <<<"$flag")"
            # A boolean flag keeps its payload under filters.payloads."true",
            # stored as a JSON-encoded string.
            body="$(jq -c --arg v "$value" '{filters: (.filters | .payloads = ((.payloads // {}) + {"true": ($v | tojson)}))}' <<<"$flag")"
            curl -fsS -X PATCH "${auth[@]}" "$api/$id/" -d "$body" >/dev/null
            echo "$key = $value"
          done
          {
            echo "### Update announced: $VERSION"
            for i in "${!keys[@]}"; do echo "- \`${keys[$i]}\`: ${values[$i]}"; done
            [ "$MACOS_OK" = true ] || echo "- macOS not announced (its build didn't succeed)"
            [ "$WINDOWS_OK" = true ] || echo "- Windows not announced (its build didn't succeed)"
          } >> "$GITHUB_STEP_SUMMARY"
