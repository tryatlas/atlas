[package]
name = "atlas-agent-servers"
version = "0.1.0"
edition = "2021"

[dependencies]
atlas-process = { path = "../atlas-process" }
# Same exact pin as `atlas-acp-thread`.
agent-client-protocol = { version = "=2.0.0", features = ["unstable"] }
atlas-acp-thread = { path = "../atlas-acp-thread" }
atlas-terminal = { path = "../atlas-terminal" }
anyhow = "1"
chrono = "0.4"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "rt", "process", "io-util", "macros", "time"] }
# Bridges tokio's AsyncRead/AsyncWrite to the futures traits the SDK transport
# expects.
tokio-util = { version = "0.7", features = ["compat"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

# `setsid` + `killpg`, so an agent's whole process tree dies with its
# connection (see `AgentChild` in connection.rs). Same pin as atlas-terminal.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# Already present in the workspace lock; kill-on-close process-tree ownership.
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp"] }

[features]
# `test_support::ScriptedAgent`, the scripted ACP agent process the
# conformance suite runs. Turned on under `[dev-dependencies]` only, here and
# in every consumer, so no shipping build compiles it.
test-support = []

[dev-dependencies]
# The shared scripted `AgentConnection`; the feature is for tests only.
atlas-acp-thread = { path = "../atlas-acp-thread", features = ["test-support"] }
# This crate's own integration tests use the scripted agent too.
atlas-agent-servers = { path = ".", features = ["test-support"] }
tokio = { version = "1", features = ["full", "test-util"] }

# The workspace lint table is only real for members that opt in —
# without this stanza it is dead configuration (#60).
[lints]
workspace = true
