[package]
name = "atlas-agent-wire"
version = "0.1.0"
edition = "2021"
description = "The additive-only session-delta wire shapes, enforced by tests/contract.rs."

[lib]
name = "atlas_agent_wire"

[dependencies]
# NOTE: no protocol crate, deliberately. Both ACP stacks must be able to produce
# these types, and `agent-client-protocol` 1.3 and 2.0 can never share a Cargo
# graph (each pins its schema crate exactly). See src/types.rs.
atlas-bus = { path = "../atlas-bus" }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync"] }
# The frontend's types for this wire are generated from these, so `tsc` is
# what holds the two sides together (tests/bindings.rs). `serde-json-impl` is
# left off on purpose: it renders `serde_json::Value` as a recursive `JsonValue`
# that the frontend's own ACP payload types cannot be assigned or narrowed to,
# so each opaque payload says `#[ts(type = "unknown")]` instead, and a new one
# does not compile until it does.
ts-rs = { workspace = true, features = ["chrono-impl", "uuid-impl"] }
uuid = { version = "1", features = ["v4", "serde"] }

# The workspace lint table is only real for members that opt in —
# without this stanza it is dead configuration (#60).
[lints]
workspace = true
